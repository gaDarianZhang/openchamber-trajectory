name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check tag matches package version
        run: |
          node -e '
            const pkg = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME;
            if (tag !== `v${pkg.version}`) {
              console.error(`Tag ${tag} does not match package version v${pkg.version}`);
              process.exit(1);
            }
          '

      - name: Build and test
        run: bun run check

      - name: Package release artifacts
        run: bun run package

      - name: Publish collector to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./collector/package.json').version")
          if npm view "openchamber-trajectory-collector@$VERSION" version >/dev/null 2>&1; then
            echo "openchamber-trajectory-collector@$VERSION is already on npm; skipping"
          else
            npm publish ./collector --access public --provenance
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tgz
